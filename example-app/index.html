<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@capgo/capacitor-file-sharer Example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-file-sharer</h1>
      <p class="lead">Share or save a generated text file.</p>

      <label for="file-text">File contents</label>
      <input id="file-text" type="text" value="Hello from Capgo File Sharer" />

      <div class="actions">
        <button id="share-file">Share file</button>
        <button id="save-file">Save file</button>
        <button id="get-version">Get plugin version</button>
      </div>

      <pre id="plugin-output">Choose an action.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
